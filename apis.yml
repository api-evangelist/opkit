name: Opkit
kind: company
description: Opkit was a healthcare automation company that built an automated
  health insurance verification platform purpose-built for telehealth companies
  and virtual medical practices. The Opkit REST API let engineering teams run
  insurance eligibility checks, read benefits, look up payers, manage patients,
  and receive webhook events programmatically. Opkit (YC S21) later pivoted to a
  generative-AI healthcare call center and was acqui-hired by 11x in late 2024,
  after which the platform was wound down. This catalog documents the API as it
  was publicly described while it was operating.
