description: >-
  FinOps view of Opkit spend. Opkit billed via a sales-led monthly subscription
  scaled by usage - number of patients and number of eligibility checks - rather
  than transparent self-serve per-call pricing. Exact rates were not published,
  so cost figures are not reconciled. The platform appears decommissioned after
  the company's late-2024 acqui-hire by 11x; this artifact describes the billing
  model as publicly characterized.
notes: >-
  Subscription tiers and per-check rates were quote-based and not published.
  Verify against authoritative documentation during reconciliation; the live
  docs at docs.opkit.co are no longer reachable.
