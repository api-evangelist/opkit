principles:
- name: Visibility
  description: Track eligibility-check volume and active patient counts against the contracted tier allowance.
- name: Allocation
  description: Tag API keys per practice/workload to map verification spend to internal cost centers.
- name: Optimization
  description: Avoid redundant re-verifications; rely on webhook-driven results instead of polling to reduce wasted calls.
- name: Accountability
  description: Review monthly subscription tier fit against actual patient and eligibility-check volume.
