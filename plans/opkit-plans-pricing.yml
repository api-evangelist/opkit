description: >-
  Opkit used a sales-led subscription model rather than self-serve public
  pricing. Customers paid a monthly fee for platform access across multiple
  tiers scaled by usage - measured by number of patients and number of
  eligibility checks performed. Specific tier names and prices were not
  published and are not reconciled in this artifact. Note that the Opkit
  platform appears decommissioned following the company's late-2024 acqui-hire
  by 11x; figures here describe the model as it was publicly described, not a
  currently purchasable offering.
notes: >-
